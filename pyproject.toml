[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloud-cost-sept-2026"
version = "0.1.0"
description = "OpenAI Agents SDK project for read-only AWS cloud cost analysis and optimization planning."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "openai-agents"
]

[project.scripts]
aws-cloud-cost-agent = "aws_cloud_cost_agent.cli:main"

[tool.setuptools.package-data]
"aws_cloud_cost_agent.tools" = ["*.md", "*/*.md"]
