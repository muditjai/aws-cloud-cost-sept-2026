[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloud-cost-sept-2026"
version = "0.1.0"
description = "Respan-powered agent for read-only AWS cloud cost analysis and optimization planning."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "Markdown>=3.7,<4",
  "openai>=1.0.0"
]

[project.scripts]
aws-cloud-cost-agent = "aws_cloud_cost_agent.cli:main"
aws-cloud-cost-web = "aws_cloud_cost_agent.web:main"

[tool.setuptools.packages.find]
include = ["aws_cloud_cost_agent*"]

[tool.setuptools.package-data]
"aws_cloud_cost_agent" = ["web_assets/*"]
"aws_cloud_cost_agent.tools" = ["*.md", "*/*.md"]
